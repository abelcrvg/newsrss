name: Apply NewsRSS fixes

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply G1 reader deduplication
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/abelcrvg/newsrss/data/extraction/JsoupArticleExtractor.kt")
          text = path.read_text()

          start = text.index("    private fun removeDuplicateContent(")
          end = text.index("    private fun extractSubtitle(", start)

          replacement = r'''    /**
     * Removes repeated editorial text that some G1 pages expose twice:
     * first as a highlights list and again as normal paragraphs.
     *
     * The comparison is deliberately semantic rather than only exact-string:
     * HTML extraction can change punctuation, whitespace or inline markup.
     */
    private fun removeDuplicateContent(blocks: List<ArticleBlock>): List<ArticleBlock> {
        val seen = mutableListOf<String>()
        val result = mutableListOf<ArticleBlock>()

        fun rememberIfUnique(value: String): Boolean {
            val key = duplicateKey(value)
            if (key.isBlank()) return false
            if (seen.any { isNearDuplicate(key, it) }) return false
            seen += key
            return true
        }

        blocks.forEach { block ->
            when (block) {
                is ArticleBlock.ListBlock -> {
                    val uniqueItems = block.items.filter { item -> rememberIfUnique(item) }
                    if (uniqueItems.isNotEmpty()) result.add(block.copy(items = uniqueItems))
                }
                is ArticleBlock.Paragraph -> {
                    if (rememberIfUnique(block.text.text)) result.add(block)
                }
                is ArticleBlock.Heading -> {
                    if (rememberIfUnique(block.text)) result.add(block)
                }
                is ArticleBlock.Quote -> {
                    if (rememberIfUnique(block.text)) result.add(block)
                }
                is ArticleBlock.Image -> {
                    val key = "image:${block.url}"
                    if (seen.add(key)) result.add(block)
                }
            }
        }
        return result
    }

    private fun duplicateKey(value: String): String =
        value.lowercase()
            .replace(Regex("[^\\p{L}\\p{N}]+"), " ")
            .trim()

    private fun isNearDuplicate(a: String, b: String): Boolean {
        if (a == b) return true
        val shorter = minOf(a.length, b.length)
        val longer = maxOf(a.length, b.length)
        if (shorter < 70) return false

        if ((a.contains(b) || b.contains(a)) && shorter.toDouble() / longer >= 0.72) return true

        val aTokens = a.split(" ").filter { it.length >= 3 }.toSet()
        val bTokens = b.split(" ").filter { it.length >= 3 }.toSet()
        if (aTokens.size < 8 || bTokens.size < 8) return false
        val intersection = aTokens.intersect(bTokens).size
        val smallerSet = minOf(aTokens.size, bTokens.size)
        return intersection.toDouble() / smallerSet >= 0.88
    }

'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Install supplied NewsRSS icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64decode("REPLACE_ICON_BASE64")
          Path("app/src/main/res/drawable-nodpi/newsrss_icon.webp").write_bytes(data)
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/newsrss_icon"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/newsrss_icon"')
          p.write_text(s)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/abelcrvg/newsrss/data/extraction/JsoupArticleExtractor.kt app/src/main/AndroidManifest.xml app/src/main/res/drawable-nodpi/newsrss_icon.webp
          git commit -m "Fix G1 duplicate reader content and use NewsRSS icon"
          git push
