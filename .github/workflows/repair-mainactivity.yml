name: Repair MainActivity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair missing top-level brace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/abelcrvg/newsrss/MainActivity.kt')
          s = p.read_text()
          marker = '\nprivate fun inlineAnnotated'
          if marker not in s:
              raise SystemExit('inlineAnnotated marker not found')
          before, after = s.split(marker, 1)
          if not before.rstrip().endswith('}'):
              raise SystemExit('Unexpected MainActivity structure')
          p.write_text(before.rstrip() + '\n}\n' + marker.lstrip('\n') + after)
          PY
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-mainactivity.yml
          git add app/src/main/java/com/abelcrvg/newsrss/MainActivity.kt .github/workflows/repair-mainactivity.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix MainActivity closing brace'
          git push