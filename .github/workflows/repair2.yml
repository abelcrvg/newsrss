name: Repair2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'abelcrvg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore crawler
        run: |
          git checkout c2e3f37039c24012d84977e598ad2ac0f3fa4915 -- app/src/main/java/com/abelcrvg/newsrss/data/feed/HomepageNewsCrawler.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/abelcrvg/newsrss/data/feed/HomepageNewsCrawler.kt')
          t=p.read_text()
          t=t.replace(', "jornalista")', ')')
          p.write_text(t)
          PY
          rm -f .github/workflows/repair2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/abelcrvg/newsrss/data/feed/HomepageNewsCrawler.kt .github/workflows/repair2.yml
          git commit -m 'Repair Homepage crawler'
          git push
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle :app:assembleDebug --stacktrace
