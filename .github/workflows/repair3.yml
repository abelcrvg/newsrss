name: Repair3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'abelcrvg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix regex
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/abelcrvg/newsrss/data/feed/HomepageNewsCrawler.kt')
          lines=p.read_text().splitlines()
          for i,line in enumerate(lines):
              if 'val DATE_PUBLISHED_REGEX = Regex(' in line:
                  lines[i]='        val DATE_PUBLISHED_REGEX = Regex("""["]datePublished["]\\s*:\\s*["]([^"]+)["]""")'
          p.write_text('\n'.join(lines)+'\n')
          PY
          rm -f .github/workflows/repair3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/abelcrvg/newsrss/data/feed/HomepageNewsCrawler.kt .github/workflows/repair3.yml
          git commit -m 'Fix Homepage crawler date regex'
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle :app:assembleDebug --stacktrace
