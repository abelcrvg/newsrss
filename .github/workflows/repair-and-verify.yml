name: Repair And Verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'abelcrvg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore crawler and refine UOL filter
        run: |
          git checkout c2e3f37039c24012d84977e598ad2ac0f3fa4915 -- app/src/main/java/com/abelcrvg/newsrss/data/feed/HomepageNewsCrawler.kt
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/abelcrvg/newsrss/data/feed/HomepageNewsCrawler.kt"); t=p.read_text(); p.write_text(t.replace(", \\"jornalista\\")", ")"))'
          rm -f .github/workflows/repair-and-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/abelcrvg/newsrss/data/feed/HomepageNewsCrawler.kt .github/workflows/repair-and-verify.yml
          git commit -m 'Repair Homepage crawler and refine UOL filter'
          git push
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build final APK
        run: gradle :app:assembleDebug --stacktrace
