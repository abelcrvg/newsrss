name: Apply NewsRSS layout v2

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/abelcrvg/newsrss/MainActivity.kt')
          s = p.read_text()

          old_scaffold = '''    Scaffold { padding -> Column(Modifier.fillMaxSize().padding(padding)) {
        Column(Modifier.padding(horizontal = 20.dp, vertical = 14.dp)) {
            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) { Column { Text("NewsRSS", style = MaterialTheme.typography.headlineLarge); Text("${sources.count { it.enabled }} fontes ativas", style = MaterialTheme.typography.bodyMedium) }; Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) { OutlinedButton(onClick = { manageSources = true }) { Text("Fontes") }; Button(onClick = { refresh() }, enabled = !loading && !opening) { Text("Atualizar") } } }
            Spacer(Modifier.height(12.dp)); Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) { TabButton("Notícias", tab == 0) { tab = 0 }; TabButton("Lidas (${readItems.size})", tab == 1) { tab = 1 }; TabButton("Ler depois (${savedItems.size})", tab == 2) { tab = 2 } }
            if (tab == 0) { Spacer(Modifier.height(10.dp)); CategoryFilter(selectedCategory) { selectedCategory = it } }
        }
        when {
            tab == 0 && loading && items.isEmpty() -> LoadingView(sources, currentSource, completedSources, failedSources)
            tab == 0 && error != null && items.isEmpty() -> ErrorView(error!!) { refresh() }
            displayItems.isEmpty() -> Text(if (tab == 1) "Você ainda não leu nenhuma notícia." else if (tab == 2) "Nenhuma notícia salva para ler depois." else "Nenhuma notícia encontrada.", Modifier.padding(20.dp))
            else -> { if (error != null && tab == 0) Text(error!!, color = MaterialTheme.colorScheme.error, modifier = Modifier.padding(horizontal = 20.dp)); if (tab == 0 && loading) LoadingStatus(sources, currentSource, completedSources, failedSources); if (opening) Row(Modifier.padding(horizontal = 20.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) { CircularProgressIndicator(); Text("Abrindo notícia...") }; LazyColumn(state = listState, modifier = Modifier.fillMaxSize(), verticalArrangement = Arrangement.spacedBy(10.dp), contentPadding = PaddingValues(20.dp)) { item { Text(heading, style = MaterialTheme.typography.headlineSmall) }; items(displayItems, key = { it.id }) { item -> NewsCard(item, sources, item.url in savedUrls) { openItem(item) } } } }
        }
    } }'''

          new_scaffold = '''    Scaffold(containerColor = MaterialTheme.colorScheme.background) { padding ->
        Column(Modifier.fillMaxSize().padding(padding)) {
            Column(Modifier.padding(horizontal = 20.dp, vertical = 12.dp)) {
                Row(
                    Modifier.fillMaxWidth(),
                    horizontalArrangement = Arrangement.SpaceBetween,
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    Column(Modifier.weight(1f)) {
                        Text("NewsRSS", style = MaterialTheme.typography.headlineLarge, fontWeight = FontWeight.Bold)
                        Text(
                            if (loading && currentSource != null) "Atualizando ${sources.firstOrNull { it.id == currentSource }?.name ?: "fonte"}…" else "${sources.count { it.enabled }} fontes ativas",
                            style = MaterialTheme.typography.bodyMedium,
                            color = MaterialTheme.colorScheme.onSurfaceVariant
                        )
                    }
                    Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                        TextButton(onClick = { manageSources = true }) { Text("Fontes") }
                        Button(onClick = { refresh() }, enabled = !loading && !opening) { Text("Atualizar") }
                    }
                }
                Spacer(Modifier.height(14.dp))
                Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                    TabButton("Notícias", tab == 0) { tab = 0 }
                    TabButton("Lidas ${readItems.size}", tab == 1) { tab = 1 }
                    TabButton("Ler depois ${savedItems.size}", tab == 2) { tab = 2 }
                }
                if (tab == 0) {
                    Spacer(Modifier.height(10.dp))
                    CategoryFilter(selectedCategory) { selectedCategory = it }
                }
            }
            when {
                tab == 0 && loading && items.isEmpty() -> LoadingView(sources, currentSource, completedSources, failedSources)
                tab == 0 && error != null && items.isEmpty() -> ErrorView(error!!) { refresh() }
                displayItems.isEmpty() -> EmptyState(
                    when (tab) {
                        1 -> "Você ainda não leu nenhuma notícia."
                        2 -> "Nenhuma notícia salva para ler depois."
                        else -> "Nenhuma notícia encontrada."
                    }
                )
                else -> {
                    if (error != null && tab == 0) {
                        Text(error!!, color = MaterialTheme.colorScheme.error, modifier = Modifier.padding(horizontal = 20.dp, vertical = 4.dp))
                    }
                    if (tab == 0 && loading) {
                        LoadingStatus(sources, currentSource, completedSources, failedSources)
                    }
                    if (opening) {
                        Row(Modifier.padding(horizontal = 20.dp, vertical = 4.dp), horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                            CircularProgressIndicator(Modifier.size(18.dp), strokeWidth = 2.dp)
                            Text("Abrindo notícia…", style = MaterialTheme.typography.labelLarge)
                        }
                    }
                    LazyColumn(
                        state = listState,
                        modifier = Modifier.fillMaxSize(),
                        verticalArrangement = Arrangement.spacedBy(12.dp),
                        contentPadding = PaddingValues(start = 20.dp, end = 20.dp, top = 8.dp, bottom = 28.dp)
                    ) {
                        item {
                            Text(heading, style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)
                            Spacer(Modifier.height(2.dp))
                        }
                        items(displayItems, key = { it.id }) { item ->
                            NewsCard(item, sources, item.url in savedUrls) { openItem(item) }
                        }
                    }
                }
            }
        }
    }'''

          if old_scaffold not in s:
              raise SystemExit('Layout scaffold target not found')
          s = s.replace(old_scaffold, new_scaffold, 1)

          old_tab = '@Composable private fun TabButton(label: String, selected: Boolean, onClick: () -> Unit) { if (selected) Button(onClick) { Text(label) } else OutlinedButton(onClick) { Text(label) } }'
          new_tab = '''@Composable private fun TabButton(label: String, selected: Boolean, onClick: () -> Unit) {
              Surface(
                  modifier = Modifier.clickable(onClick = onClick),
                  shape = MaterialTheme.shapes.large,
                  color = if (selected) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.surfaceVariant,
                  contentColor = if (selected) MaterialTheme.colorScheme.onPrimary else MaterialTheme.colorScheme.onSurfaceVariant,
                  tonalElevation = if (selected) 2.dp else 0.dp
              ) {
                  Text(label, modifier = Modifier.padding(horizontal = 14.dp, vertical = 9.dp), style = MaterialTheme.typography.labelLarge)
              }
          }'''
          if old_tab not in s:
              raise SystemExit('Tab target not found')
          s = s.replace(old_tab, new_tab, 1)

          old_card_start = '@Composable private fun NewsCard(item: FeedItem, sources: List<FeedSource>, saved: Boolean, onClick: () -> Unit) {'
          start = s.find(old_card_start)
          end = s.find('\n\n@Composable private fun ReaderContent', start)
          if start < 0 or end < 0:
              raise SystemExit('NewsCard target not found')
          new_card = '''@Composable private fun NewsCard(item: FeedItem, sources: List<FeedSource>, saved: Boolean, onClick: () -> Unit) {
              val source = sources.firstOrNull { it.id == item.sourceId }
              Card(
                  modifier = Modifier.fillMaxWidth().clickable(onClick = onClick),
                  shape = MaterialTheme.shapes.large,
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                  elevation = CardDefaults.cardElevation(defaultElevation = 1.dp)
              ) {
                  Column {
                      item.imageUrl?.let {
                          AsyncImage(
                              model = it,
                              contentDescription = item.title,
                              modifier = Modifier.fillMaxWidth().height(190.dp),
                              contentScale = ContentScale.Crop
                          )
                      }
                      Column(Modifier.padding(16.dp)) {
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text(source?.name ?: "Fonte", style = MaterialTheme.typography.labelLarge, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                              item.publishedAt?.let { Text(publishedLabel(it), style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant) }
                          }
                          Spacer(Modifier.height(7.dp))
                          Text(item.title, style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold, lineHeight = 26.sp)
                          item.summary?.takeIf { it.isNotBlank() }?.let {
                              Spacer(Modifier.height(7.dp))
                              Text(it, maxLines = 3, style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant, lineHeight = 21.sp)
                          }
                          if (saved) {
                              Spacer(Modifier.height(9.dp))
                              Text("🔖 Salva para ler depois", style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.primary)
                          }
                      }
                  }
              }
          }'''
          s = s[:start] + new_card + s[end:]

          marker = '@Composable private fun ErrorView(message: String, onRetry: () -> Unit)'
          empty = '@Composable private fun EmptyState(message: String) { Column(Modifier.fillMaxWidth().padding(28.dp), horizontalAlignment = Alignment.CenterHorizontally) { Text("📰", fontSize = 38.sp); Spacer(Modifier.height(10.dp)); Text(message, style = MaterialTheme.typography.titleMedium); Text("As notícias aparecerão aqui assim que uma fonte terminar a varredura.", style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(top = 6.dp)) } }\n'
          if empty.strip() not in s:
              s = s.replace(marker, empty + marker, 1)

          p.write_text(s)
          PY
      - name: Commit and clean up
        run: |
          rm -f .github/workflows/apply-layout-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/abelcrvg/newsrss/MainActivity.kt .github/workflows/apply-layout-v2.yml
          git commit -m "Polish NewsRSS Android layout" || exit 0
          git push
